<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Colombia: Red de Ayuda Humanitaria</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #mapa { height: 500px; width: 100%; border-radius: 12px; z-index: 1; cursor: pointer; }
    .custom-pin { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

  <header class="bg-red-700 text-white p-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">SOS Colombia: Red de Ayuda Humanitaria</h1>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4 flex-1">
    <div id="mapa" class="shadow-md border border-slate-200"></div>
    <div id="contenedorTarjetas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const mapa = L.map('mapa').setView([4.6097, -74.0817], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
    const mapaMarcadores = {};

    const firebaseConfig = {
      apiKey: "AIzaSyCWPFmX6TmnjS1DkDzguqLNwgyZNYohOx8",
      databaseURL: "https://juntosayudamos-col-default-rtdb.firebaseio.com",
      projectId: "juntosayudamos-col"
    };

    firebase.initializeApp(firebaseConfig);
    const referenciaSolicitudes = firebase.database().ref('solicitudes_ayuda');

    referenciaSolicitudes.on('value', snapshot => {
      const data = snapshot.val() || {};
      const contenedor = document.getElementById('contenedorTarjetas');
      contenedor.innerHTML = '';
      
      // Limpiar mapa
      Object.keys(mapaMarcadores).forEach(key => mapa.removeLayer(mapaMarcadores[key]));

      Object.keys(data).forEach(key => {
        const item = data[key];
        if (!item) return;

        // Mapeo Inteligente: Busca los campos que existen en tus datos manuales o Excel
        const lat = parseFloat(item.latitud || item.lat || 4.6097);
        const lng = parseFloat(item.longitud || item.lng || -74.0817);
        const ubicacion = item.lugar || item.ubicacion || item.ciudad || "Ubicación desconocida";
        const desc = item.descripcion || item.notas || item.detalle || "Sin descripción";

        // Crear Tarjeta
        const div = document.createElement('div');
        div.className = "border p-4 rounded-xl bg-white shadow-sm";
        div.innerHTML = `<h3 class="font-bold">${ubicacion}</h3><p class="text-sm">${desc}</p>`;
        contenedor.appendChild(div);

        // Crear Marcador
        const marcador = L.marker([lat, lng]).addTo(mapa).bindPopup(`<b>${ubicacion}</b><br>${desc}`);
        mapaMarcadores[key] = marcador;
      });
      console.log("✅ Renderizado completo");
    });
  </script>
</body>
</html>
